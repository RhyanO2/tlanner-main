services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: TlannerDev
    ports:
      - '5432:5432'
    volumes:
      - ./docker/setup.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

volumes:
  redis_data:
